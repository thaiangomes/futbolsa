name: Carga

# Teste de carga da API (Plano do ensaio, carga e testes no navegador, T17): o gerador num processo e a API em outro, contra um
# Postgres do próprio job. Não bloqueia PR: roda só sob demanda. Os números do CI (2 a 4 núcleos compartilhados) servem para comparar
# uma execução com outra e achar gargalos de código, não para dimensionar o servidor.
on:
  workflow_dispatch:
    inputs:
      escala:
        description: "leve, pico ou completa (10.000 conexões e 10.000 jogadores)"
        default: "completa"
      cenario:
        description: "pico, degraus, tesouraria, reconexao, leituras, bots, encerramento, uma lista separada por vírgula, ou todos"
        default: "todos"

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: futbolsa
          POSTGRES_PASSWORD: futbolsa
          POSTGRES_DB: futbolsa_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U futbolsa -d futbolsa_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://futbolsa:futbolsa@localhost:5433/futbolsa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      # o Postgres do job ganha mais memória compartilhada e conexões para as 10.000 conexões do WebSocket e o histórico grande
      - name: Carga
        run: npm run carga -w @futbolsa/api -- --escala "${{ inputs.escala || 'completa' }}" --cenario "${{ inputs.cenario || 'todos' }}" --saida carga-saida
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carga-relatorio
          path: apps/api/carga-saida/
