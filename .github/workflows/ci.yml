name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos (todos os pacotes)
        run: npm run typecheck
      - name: Testes (motor e API)
        run: npm test
      - name: Build da API
        run: npm run build -w @futbolsa/api
      - name: Build do site
        run: npm run build -w @futbolsa/web
